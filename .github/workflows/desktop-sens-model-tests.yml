name: DesktopSens model tests
on:
  push:
    branches:
      - fix/sample-lut-frozen-cells
  pull_request:
    branches:
      - fix/sample-lut-frozen-cells
jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run DesktopSens model tests
        run: dotnet test grapher/DesktopSens.Tests/DesktopSens.Tests.csproj --framework net8.0 --configuration Release
